<title id="t">FIG-002. EXP-002: change in D with lambda and gamma</title><desc id="d">Simulated, confirmatory. Dot-and-interval chart of how D = tau-b(arm) minus tau-b(MEAN) changes with reporting selection (lambda 2 minus 0) and exposure coupling (gamma -0.5 or 0.5 minus 0), for SHRINK_5 and LCB. Each row averages six or four strata of 20 same-seed pairs; bars are two-sided 95% stratified bootstrap intervals. Dashed line: zero.</desc>
